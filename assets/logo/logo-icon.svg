    <line x1="60" y1="38" x2="38" y2="66"/>
    <line x1="60" y1="38" x2="82" y2="66"/>
    <line x1="38" y1="66" x2="60" y2="88"/>
    <line x1="82" y1="66" x2="60" y2="88"/>
    <line x1="38" y1="66" x2="82" y2="66"/>
  </g>
  <g fill="url(#msNodeGrad)">
    <circle cx="60" cy="38" r="7.5"/>
    <circle cx="38" cy="66" r="6"/>
    <circle cx="82" cy="66" r="6"/>
    <circle cx="60" cy="88" r="7.5"/>
  </g>
</svg>
