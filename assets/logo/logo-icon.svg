<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="msIconGrad" x1="10" y1="8" x2="110" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3D7BFF"/>
      <stop offset="1" stop-color="#0B1E4D"/>
    </linearGradient>
    <linearGradient id="msNodeGrad" x1="20" y1="20" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3FD0FF"/>
      <stop offset="1" stop-color="#3D7BFF"/>
